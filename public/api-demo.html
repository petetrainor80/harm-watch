<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harm Watch API Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; color: #1a1a1a; background: #f5f5f5; min-height: 100vh; }

    .header { background: #1d70b8; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 10px; }
    .header svg { flex-shrink: 0; }
    .header-title { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
    .header-badge { margin-left: auto; background: rgba(255,255,255,0.18); font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; }

    .container { max-width: 1200px; margin: 0 auto; padding: 20px 20px 40px; }

    .card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 18px 20px; margin-bottom: 16px; }
    .card-title { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 14px; }

    label { font-size: 12px; color: #555; font-weight: 500; }
    input[type="text"], input[type="password"], input[type="date"], select {
      height: 34px; border: 1px solid #bbb; border-radius: 4px; padding: 0 10px;
      font-size: 13px; color: #1a1a1a; background: #fff; width: 100%;
    }
    input:focus, select:focus { outline: 3px solid #ffdd00; outline-offset: 0; border-color: #0b0c0c; }

    .auth-row { display: flex; gap: 10px; align-items: flex-end; }
    .auth-row .field { display: flex; flex-direction: column; gap: 5px; }
    .auth-row .field-key { flex: 1; }
    .auth-row .field-url { width: 320px; flex-shrink: 0; }

    .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .filter-field { display: flex; flex-direction: column; gap: 5px; }
    .filter-field select, .filter-field input { width: 150px; }
    .filter-field.wide input { width: 200px; }

    .btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: none; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.12s; white-space: nowrap; }
    .btn-primary { background: #1d70b8; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #1558a0; }
    .btn-outline { background: transparent; border: 1px solid #1d70b8; color: #1d70b8; }
    .btn-outline:hover:not(:disabled) { background: #e8f1fb; }
    .btn-ghost { background: transparent; border: 1px solid #bbb; color: #555; }
    .btn-ghost:hover:not(:disabled) { background: #f0f0f0; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

    /* results */
    .stats-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .stat-pill { background: #e8f1fb; border: 1px solid #c2d9f0; border-radius: 4px; padding: 3px 10px; font-size: 12px; color: #1558a0; font-weight: 600; }
    .stat-pill.warn { background: #fff4e5; border-color: #f5c07b; color: #9a6c00; }
    .stat-pill.ok { background: #e3f5e1; border-color: #a1d89a; color: #1a6e10; }

    .json-toggle-btn { margin-left: auto; font-size: 11px; color: #1d70b8; background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; }
    .json-toggle-btn:hover { color: #1558a0; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 12px; background: #f5f5f5; font-weight: 600; color: #333; border-bottom: 2px solid #ddd; white-space: nowrap; font-size: 12px; }
    td { padding: 9px 12px; border-bottom: 1px solid #eee; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafcff; }
    .url-cell { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; color: #c00; word-break: break-all; max-width: 340px; }
    .domain-cell { font-size: 12px; color: #444; white-space: nowrap; }
    .count { font-weight: 700; color: #1d70b8; }
    .tag { display: inline-block; background: #e8f1fb; color: #1558a0; border-radius: 3px; padding: 1px 6px; font-size: 11px; margin: 1px 2px 1px 0; white-space: nowrap; }
    .status { font-size: 12px; font-weight: 600; white-space: nowrap; }
    .status-live { color: #1a6e10; }
    .status-under_review { color: #9a6c00; }
    .status-removed { color: #c00; }
    .date-cell { font-size: 11px; color: #666; white-space: nowrap; }
    .num-cell { font-size: 12px; color: #999; }

    .pagination-bar { display: flex; align-items: center; gap: 12px; padding: 14px 0 0; border-top: 1px solid #eee; margin-top: 2px; }
    .pagination-info { font-size: 12px; color: #666; }

    .json-view { margin-top: 16px; background: #1e1e2e; color: #cdd6f4; font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; line-height: 1.6; padding: 16px; border-radius: 4px; overflow: auto; max-height: 400px; white-space: pre; }

    .empty-state { text-align: center; padding: 48px 20px; color: #888; }
    .empty-state-icon { font-size: 32px; margin-bottom: 10px; }
    .empty-state-text { font-size: 14px; }

    .error-box { background: #fef2f2; border: 1px solid #fca5a5; border-radius: 4px; padding: 12px 16px; color: #991b1b; font-size: 13px; }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc; border-top-color: #1d70b8; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-bar { text-align: center; padding: 32px; color: #666; font-size: 13px; }
  </style>
</head>
<body>

<div class="header">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
  </svg>
  <span class="header-title">Harm Watch</span>
  <span style="font-size:13px; opacity:0.7; margin-left:-4px;">API Demo</span>
  <span class="header-badge">v1 · Read-only</span>
</div>

<div class="container">

  <!-- Auth -->
  <div class="card">
    <div class="card-title">Authentication</div>
    <div class="auth-row">
      <div class="field field-key">
        <label for="apiKey">API Key</label>
        <div style="display:flex; gap:6px;">
          <input type="password" id="apiKey" placeholder="hw_live_…" autocomplete="off" style="flex:1; font-family: monospace;" />
          <button class="btn btn-ghost btn-sm" onclick="toggleKeyVis(this)" style="height:34px; flex-shrink:0;">Show</button>
        </div>
      </div>
      <div class="field field-url">
        <label for="baseUrl">Base URL</label>
        <input type="text" id="baseUrl" value="https://www.harm.watch/api/v1" />
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="card">
    <div class="card-title">Filters</div>
    <div class="filters">
      <div class="filter-field">
        <label for="fLimit">Limit</label>
        <select id="fLimit">
          <option value="10">10</option>
          <option value="25" selected>25</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="fStatus">Status</label>
        <select id="fStatus">
          <option value="live" selected>live</option>
          <option value="under_review">under_review</option>
          <option value="removed">removed</option>
          <option value="">— any —</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="fCategory">Category</label>
        <select id="fCategory" style="width:220px;">
          <option value="">— any —</option>
          <option value="pornography">pornography</option>
          <option value="age-restricted-content">age-restricted-content</option>
          <option value="online-safety-harmful-content">online-safety-harmful-content</option>
          <option value="hate-speech">hate-speech</option>
          <option value="suicide-self-harm">suicide-self-harm</option>
          <option value="eating-disorder">eating-disorder</option>
          <option value="fraud-financial-scam">fraud-financial-scam</option>
          <option value="harassment-cyberbullying">harassment-cyberbullying</option>
          <option value="misinformation">misinformation</option>
          <option value="drugs">drugs</option>
          <option value="weapons">weapons</option>
          <option value="counterfeit-goods">counterfeit-goods</option>
          <option value="animal-cruelty">animal-cruelty</option>
          <option value="foreign-interference">foreign-interference</option>
        </select>
      </div>
      <div class="filter-field wide">
        <label for="fDomain">Domain</label>
        <input type="text" id="fDomain" placeholder="example.com" />
      </div>
      <div class="filter-field">
        <label for="fSince">Since</label>
        <input type="date" id="fSince" />
      </div>
      <div style="display:flex; gap:6px; align-items:flex-end; margin-top:auto;">
        <button class="btn btn-primary" id="fetchBtn" onclick="fetchFirst()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Fetch
        </button>
        <button class="btn btn-ghost" onclick="resetFilters()">Reset</button>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div id="resultsArea"></div>

</div>

<script>
var state = {
  rows: [],
  nextCursor: null,
  hasMore: false,
  loading: false,
  error: null,
  rateLimit: null,
  rateLimitRemaining: null,
  rateLimitReset: null,
  showJson: false,
  lastRawJson: null,
};

function toggleKeyVis(btn) {
  var el = document.getElementById('apiKey');
  if (el.type === 'password') { el.type = 'text'; btn.textContent = 'Hide'; }
  else { el.type = 'password'; btn.textContent = 'Show'; }
}

function resetFilters() {
  document.getElementById('fLimit').value = '25';
  document.getElementById('fStatus').value = 'live';
  document.getElementById('fCategory').value = '';
  document.getElementById('fDomain').value = '';
  document.getElementById('fSince').value = '';
}

function fetchFirst() {
  state.rows = [];
  state.nextCursor = null;
  state.lastRawJson = null;
  doFetch(null);
}

function fetchMore() {
  doFetch(state.nextCursor);
}

function doFetch(cursor) {
  var key = document.getElementById('apiKey').value.trim();
  if (!key) { alert('Paste your API key (hw_live_…) into the API Key field first.'); return; }
  var baseUrl = document.getElementById('baseUrl').value.trim().replace(/\/$/, '');

  var params = new URLSearchParams();
  var limit = document.getElementById('fLimit').value;
  var status = document.getElementById('fStatus').value;
  var category = document.getElementById('fCategory').value;
  var domain = document.getElementById('fDomain').value.trim();
  var since = document.getElementById('fSince').value;

  if (limit)    params.set('limit', limit);
  if (status)   params.set('status', status);
  if (category) params.set('category', category);
  if (domain)   params.set('domain', domain);
  if (since)    params.set('since', since);
  if (cursor)   params.set('cursor', cursor);

  var url = baseUrl + '/submissions?' + params.toString();

  state.loading = true;
  state.error = null;
  render();

  fetch(url, { headers: { 'Authorization': 'Bearer ' + key } })
    .then(function(res) {
      state.rateLimit          = res.headers.get('X-RateLimit-Limit');
      state.rateLimitRemaining = res.headers.get('X-RateLimit-Remaining');
      state.rateLimitReset     = res.headers.get('X-RateLimit-Reset');
      return res.json().then(function(json) { return { ok: res.ok, status: res.status, json: json }; });
    })
    .then(function(r) {
      state.lastRawJson = JSON.stringify(r.json, null, 2);
      if (!r.ok) {
        state.error = (r.json.error && r.json.error.message) ? r.json.error.message : 'HTTP ' + r.status;
      } else {
        if (cursor) {
          state.rows = state.rows.concat(r.json.data || []);
        } else {
          state.rows = r.json.data || [];
        }
        state.nextCursor = r.json.next_cursor || null;
        state.hasMore    = !!r.json.has_more;
      }
    })
    .catch(function(e) {
      state.error = e.message || 'Network error';
    })
    .finally(function() {
      state.loading = false;
      render();
    });
}

function fmtDate(s) {
  if (!s) return '—';
  var d = new Date(s);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function fmtReset(ts) {
  if (!ts) return null;
  var d = new Date(parseInt(ts, 10) * 1000);
  return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function render() {
  var el = document.getElementById('resultsArea');

  if (state.loading && state.rows.length === 0) {
    el.innerHTML = '<div class="card loading-bar"><span class="spinner"></span>&ensp;Fetching…</div>';
    return;
  }

  if (state.error && state.rows.length === 0) {
    el.innerHTML = '<div class="error-box"><strong>Error:</strong> ' + esc(state.error) + '</div>';
    return;
  }

  if (!state.lastRawJson && !state.loading) return;

  var statsHtml = '<div class="stats-row">' +
    '<span class="stat-pill">' + state.rows.length + ' row' + (state.rows.length !== 1 ? 's' : '') + '</span>';

  if (state.rateLimitRemaining !== null) {
    var remaining = parseInt(state.rateLimitRemaining, 10);
    var limit     = parseInt(state.rateLimit, 10) || 1000;
    var pct       = Math.round(remaining / limit * 100);
    var cls       = pct < 20 ? 'warn' : 'ok';
    var reset     = fmtReset(state.rateLimitReset);
    statsHtml += '<span class="stat-pill ' + cls + '">' + remaining + ' / ' + limit + ' requests left' + (reset ? ' · resets ' + reset : '') + '</span>';
  }

  if (state.hasMore) {
    statsHtml += '<span class="stat-pill warn">More available — use Load more</span>';
  }

  if (state.error) {
    statsHtml += '<span class="stat-pill" style="background:#fef2f2;border-color:#fca5a5;color:#991b1b;">Error: ' + esc(state.error) + '</span>';
  }

  statsHtml += '<button class="json-toggle-btn" onclick="toggleJson()">' + (state.showJson ? 'Hide raw JSON' : 'View raw JSON') + '</button>';
  statsHtml += '</div>';

  var tableHtml = '<div class="table-wrap"><table><thead><tr>' +
    '<th>#</th>' +
    '<th>URL (defanged)</th>' +
    '<th>Domain</th>' +
    '<th>Reports</th>' +
    '<th>Categories</th>' +
    '<th>Status</th>' +
    '<th>First seen</th>' +
    '<th>Last seen</th>' +
    '</tr></thead><tbody>';

  if (state.rows.length === 0) {
    tableHtml += '<tr><td colspan="8" style="text-align:center; color:#888; padding:32px;">No results for these filters.</td></tr>';
  } else {
    state.rows.forEach(function(r, i) {
      var cats = (r.categories || []).map(function(c) { return '<span class="tag">' + esc(c) + '</span>'; }).join('');
      var statusCls = 'status-' + (r.status || '');
      tableHtml += '<tr>' +
        '<td class="num-cell">' + (i + 1) + '</td>' +
        '<td><div class="url-cell" title="' + esc(r.url) + '">' + esc(r.url && r.url.length > 80 ? r.url.slice(0, 80) + '…' : r.url) + '</div></td>' +
        '<td class="domain-cell">' + esc(r.domain || '—') + '</td>' +
        '<td><span class="count">' + (r.report_count != null ? r.report_count : '—') + '</span></td>' +
        '<td>' + (cats || '<span style="color:#bbb; font-size:11px;">none</span>') + '</td>' +
        '<td><span class="status ' + esc(statusCls) + '">' + esc(r.status || '—') + '</span></td>' +
        '<td class="date-cell">' + fmtDate(r.first_reported_at) + '</td>' +
        '<td class="date-cell">' + fmtDate(r.last_reported_at) + '</td>' +
        '</tr>';
    });
  }

  tableHtml += '</tbody></table></div>';

  var paginationHtml = '';
  if (state.hasMore || state.loading) {
    paginationHtml = '<div class="pagination-bar">' +
      '<button class="btn btn-outline" onclick="fetchMore()" ' + (state.loading ? 'disabled' : '') + '>' +
      (state.loading ? '<span class="spinner"></span> Loading…' : 'Load more') +
      '</button>' +
      '<span class="pagination-info">Keyset pagination · cursor stored in state</span>' +
      '</div>';
  } else if (state.rows.length > 0) {
    paginationHtml = '<div class="pagination-bar"><span class="pagination-info" style="color:#888;">End of results</span></div>';
  }

  var jsonHtml = '';
  if (state.showJson && state.lastRawJson) {
    jsonHtml = '<div class="json-view">' + esc(state.lastRawJson) + '</div>';
  }

  el.innerHTML = '<div class="card">' + statsHtml + tableHtml + paginationHtml + jsonHtml + '</div>';
}

function toggleJson() {
  state.showJson = !state.showJson;
  render();
}

// Persist key in sessionStorage across reloads
var saved = sessionStorage.getItem('hw_demo_key');
if (saved) document.getElementById('apiKey').value = saved;
document.getElementById('apiKey').addEventListener('input', function(e) {
  sessionStorage.setItem('hw_demo_key', e.target.value);
});
</script>
</body>
</html>
